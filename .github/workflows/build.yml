name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macOS runners use up a private repo's free Actions minutes ten times as
    # fast, so while it's private, pushes and pull requests skip the build and
    # only version tags and runs started by hand build. Once it's public, every
    # push and pull request builds, with nothing to change here.
    if: ${{ !github.event.repository.private || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build tools
        run: brew install cmake ninja xcodegen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Test the extension SDK and official extensions
        run: make test-extensions

      - name: Restore engine build
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: |
            engine/dist
            engine/.cache
          key: engine-universal-${{ hashFiles('engine/versions.env', 'engine/build.sh', 'engine/patches/**') }}

      - name: Build engine (universal)
        if: steps.engine-cache.outputs.cache-hit != 'true'
        run: make engine ARCHS="arm64 x86_64"

      - name: Run tests
        run: make test

      - name: Build app and disk image
        run: make dmg ARCHS="arm64 x86_64"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: OrbTorrent-dmg
          path: build/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's notes, then the engine's versions, with what changed
          # since the release before.
          previous="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -n "$previous" ]]; then git fetch --depth 1 origin tag "$previous"; fi
          {
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
            echo
            scripts/engine-notes.sh $previous
          } > build/release-notes.md
          # v1.0-beta.2 is "OrbTorrent 1.0 beta 2".
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" build/*.dmg engine/.cache/*.tar.* \
            --title "OrbTorrent ${version/-beta./ beta }" --notes-file build/release-notes.md --draft
