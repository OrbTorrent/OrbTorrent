name: Website

# Builds orbtorrent.com and its docs when they change: type-checks the code,
# tests the email sign-up, builds every page, checks every link between docs
# pages, and checks that the API reference covers every export of
# @orbtorrent/api. Then a push to main deploys it, once the repo is public
# (from the first release) and the secret CLOUDFLARE_WEBSITE_TOKEN is set; so
# does running it by hand on main. From a Mac, it's `npm run deploy` in
# website/.

on:
  pull_request:
    paths:
      - "website/**"
      - "sdk/src/index.ts"
      - "sdk/CHANGELOG.md"
  push:
    branches: [main]
    paths:
      - "website/**"
      - "sdk/src/index.ts"
      - "sdk/CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, each after the one before.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOYS: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !github.event.repository.private && secrets.CLOUDFLARE_WEBSITE_TOKEN != '' }}
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          # Each docs page's "Last updated" date comes from its history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build the emails, and check them
        run: npm run emails && npx tsc -p emails

      - name: Type-check
        run: npx astro check

      - name: Test the email sign-up
        run: npm test

      - name: Build, and check the docs' links
        run: npx astro build

      # The Worker and the pages just built, as wrangler.jsonc says. The token
      # can deploy Workers, with the site's database, email and domain.
      - name: Deploy
        if: env.DEPLOYS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WEBSITE_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
