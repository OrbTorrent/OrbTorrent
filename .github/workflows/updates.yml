name: Publish the update

# Puts each release in the update feed at updates.orbtorrent.com once it's
# published, with scripts/publish-update.sh, so every installed OrbTorrent
# finds it within a day. A release whose notes have <!-- update: critical -->
# or <!-- update: phased --> goes in that way. Run it by hand with a release's
# tag to publish it as critical or phased later, or to withdraw it. It signs with the update key, in the
# secret SPARKLE_PRIVATE_KEY, uploads with CLOUDFLARE_API_TOKEN, and does
# nothing until both are set.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v1.0-beta.2
        required: true
      kind:
        description: "normal, critical (can't be skipped), phased (a seventh more Macs each day) or withdraw"
        type: choice
        options: [normal, critical, phased, withdraw]
        default: normal

permissions:
  contents: read
  # --withdraw points the Homebrew tap back at the version before.
  actions: write

# One change to the feed at a time, each starting from the one before.
concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  publish:
    # Sparkle's tools, which sign the feed, are Mac programs.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      KIND: ${{ inputs.kind || 'normal' }}
      HAS_KEYS: ${{ secrets.SPARKLE_PRIVATE_KEY != '' && secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Skip without the update key and the Cloudflare token
        if: env.HAS_KEYS != 'true'
        run: echo "::notice::No SPARKLE_PRIVATE_KEY or CLOUDFLARE_API_TOKEN yet, so the feed isn't updated."

      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'

      - name: Set up Node.js
        if: env.HAS_KEYS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: updates/package-lock.json

      - name: Install cf
        if: env.HAS_KEYS == 'true'
        working-directory: updates
        run: npm ci --no-audit --no-fund

      - name: Publish
        if: env.HAS_KEYS == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          # A release asks to be critical or phased with a comment in its
          # notes, which publish-update.sh leaves out of What's New.
          case "$RELEASE_BODY" in
            *"<!-- update: critical -->"*) KIND=critical ;;
            *"<!-- update: phased -->"*) KIND=phased ;;
          esac
          case "$KIND" in
            normal) scripts/publish-update.sh "$TAG" ;;
            critical | phased | withdraw) scripts/publish-update.sh "--$KIND" "$TAG" ;;
            *) echo "::error::Unknown kind $KIND."; exit 1 ;;
          esac
