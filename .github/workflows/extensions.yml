name: Extensions

on:
  pull_request:
    paths:
      - "extensions/**"
      - "sdk/**"
      - "skills/**"
      - "scripts/extension-*"
      - "package.json"
      - "package-lock.json"

# A pull request from a fork gets a token that can only read. The comment on
# changed permissions comes from extension-permissions.yml instead.
permissions:
  contents: read

jobs:
  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build and test the SDK
        run: |
          npm run build --workspace sdk
          npm test --workspace sdk

      - name: Test, lint and build each official extension
        run: |
          for extension in extensions/*/; do
            (cd "$extension" && npx orb test && npx orb lint && npx orb build) || exit 1
          done

      - name: Check every copy of AGENTS.md is up to date
        run: node scripts/extension-docs.mjs --check

      - name: Test the permission comparison
        run: node --test "scripts/*.test.mjs"
