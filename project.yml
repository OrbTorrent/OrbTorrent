name: OrbTorrent

options:
  bundleIdPrefix: com.orbtorrent
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Debug and Dev build OrbTorrent Dev, the app used while developing OrbTorrent,
# with its own bundle identifier, library and settings. Release builds OrbTorrent.
configs:
  Debug: debug
  Dev: release
  Release: release

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  OrbTorrent:
    type: application
    platform: macOS
    sources:
      - path: OrbTorrent
    dependencies:
      - target: ExtensionHost
        embed: false
      # Automatic updates, downloaded by scripts/fetch-sparkle.sh (make sparkle).
      - framework: build/sparkle/Sparkle.framework
        embed: true
    scheme:
      testTargets:
        - OrbTorrentTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbtorrent.mac
        PRODUCT_NAME: OrbTorrent
        PRODUCT_MODULE_NAME: OrbTorrent
        INFOPLIST_FILE: OrbTorrent/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ORB_DEVELOPMENT: NO
        EXCLUDED_SOURCE_FILE_NAMES: AppIconDev.icon
      configs:
        Debug: &dev
          PRODUCT_BUNDLE_IDENTIFIER: com.orbtorrent.mac.dev
          PRODUCT_NAME: OrbTorrent Dev
          ORB_DEVELOPMENT: YES
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
          EXCLUDED_SOURCE_FILE_NAMES: AppIcon.icon
        Dev: *dev
        # Notarization refuses the entitlement that lets a debugger attach.
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    info:
      path: OrbTorrent/Info.plist
      properties:
        CFBundleName: $(PRODUCT_NAME)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Sanjevi Rau. OrbTorrent is free software, licensed under the GNU GPL v3 or later."
        NSUserNotificationAlertStyle: banner
        # Updates: checked daily from a feed on a domain we own, which must
        # never change. The feed and each update are signed with the key
        # whose public half is here (see scripts/publish-update.sh).
        SUFeedURL: https://updates.orbtorrent.com/appcast.xml
        SUPublicEDKey: h+ekujzHWLavqy/lYuMphIWEj9grNNCiAb41q8PTYj4=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Updates download in the background, and OrbTorrent restarts to
        # install them while it isn't in use (see Updates.swift).
        SUAutomaticallyUpdate: true
        CFBundleURLTypes:
          - CFBundleURLName: Magnet Link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - magnet
        CFBundleDocumentTypes:
          - CFBundleTypeName: BitTorrent Document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - org.bittorrent.torrent
          - CFBundleTypeName: OrbTorrent Extension
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.orbtorrent.extension
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.orbtorrent.extension
            UTTypeDescription: OrbTorrent Extension
            UTTypeConformsTo:
              - public.data
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - orbext
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.bittorrent.torrent
            UTTypeDescription: BitTorrent Document
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - torrent
              public.mime-type:
                - application/x-bittorrent
    postBuildScripts:
      - name: Leave links and files to OrbTorrent in OrbTorrent Dev
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # OrbTorrent Dev never opens magnet links or .torrent files, so it
          # can't take them over from the OrbTorrent in use. It doesn't update
          # itself either, unless pointed at a test feed (see Updates.swift).
          if [ "${ORB_DEVELOPMENT:-NO}" = YES ]; then
            PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :CFBundleDocumentTypes" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$PLIST" 2>/dev/null || true
          fi
      - name: Embed qBittorrent engine
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          ENGINE="${SRCROOT}/engine/dist/qbittorrent-nox"
          if [ ! -x "$ENGINE" ]; then
            echo "error: The qBittorrent engine has not been built. Run 'make engine' first."
            exit 1
          fi
          DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/qbittorrent-nox"
          cp -f "$ENGINE" "$DEST"
          # Notarization needs a secure timestamp, which only Developer ID builds wait for.
          case "${CODE_SIGN_IDENTITY:-}" in "Developer ID"*) TIMESTAMP=--timestamp ;; *) TIMESTAMP=--timestamp=none ;; esac
          codesign --force --options runtime "$TIMESTAMP" \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST"
          LICENSES="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Licenses"
          rm -rf "$LICENSES" && mkdir -p "$LICENSES"
          cp -R "${SRCROOT}/engine/dist/licenses/." "$LICENSES/" 2>/dev/null || true
          cp -f "${SRCROOT}/engine/dist/VERSIONS.txt" "$LICENSES/ENGINE-VERSIONS.txt" 2>/dev/null || true
          cp -f "${SRCROOT}/LICENSE" "$LICENSES/OrbTorrent-LICENSE.txt"
          cp -f "${SRCROOT}/build/sparkle/LICENSE" "$LICENSES/Sparkle-LICENSE.txt"
      - name: Embed extension host and official extensions
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # The helper that runs extensions, sandboxed, with its own entitlements.
          HOST="${BUILT_PRODUCTS_DIR}/orb-extension-host"
          DEST="${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/orb-extension-host"
          cp -f "$HOST" "$DEST"
          case "${CODE_SIGN_IDENTITY:-}" in "Developer ID"*) TIMESTAMP=--timestamp ;; *) TIMESTAMP=--timestamp=none ;; esac
          codesign --force --options runtime "$TIMESTAMP" \
            --entitlements "${SRCROOT}/ExtensionHost/ExtensionHost.entitlements" \
            --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}" "$DEST"
          # Official extensions, built by `make extensions`.
          EXTENSIONS="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/Extensions"
          rm -rf "$EXTENSIONS" && mkdir -p "$EXTENSIONS"
          for source in "${SRCROOT}"/extensions/*/; do
            [ -f "$source/package.json" ] || continue
            name="$(basename "$source")"
            if [ ! -f "$source/dist/package.json" ]; then
              echo "error: The $name extension has not been built. Run 'make extensions' first."
              exit 1
            fi
            cp -R "$source/dist" "$EXTENSIONS/$name"
          done

      - name: Sign Sparkle's helpers
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          # Sparkle's helpers come signed ad hoc. Notarization needs every
          # program inside the app signed with its certificate and the
          # hardened runtime. The XPC services are only for sandboxed apps.
          SPARKLE="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}/Sparkle.framework"
          case "${CODE_SIGN_IDENTITY:-}" in "Developer ID"*) TIMESTAMP=--timestamp ;; *) TIMESTAMP=--timestamp=none ;; esac
          FLAGS=(--force --options runtime "$TIMESTAMP" --sign "${EXPANDED_CODE_SIGN_IDENTITY:--}")
          rm -rf "$SPARKLE/Versions/B/XPCServices" "$SPARKLE/XPCServices"
          codesign "${FLAGS[@]}" "$SPARKLE/Versions/B/Autoupdate"
          codesign "${FLAGS[@]}" "$SPARKLE/Versions/B/Updater.app"
          codesign "${FLAGS[@]}" "$SPARKLE"

  ExtensionHost:
    type: tool
    platform: macOS
    sources:
      - path: ExtensionHost
        excludes:
          - "*.plist"
          - "*.entitlements"
    settings:
      base:
        PRODUCT_NAME: orb-extension-host
        PRODUCT_BUNDLE_IDENTIFIER: com.orbtorrent.mac.extension-host
        CODE_SIGN_ENTITLEMENTS: ExtensionHost/ExtensionHost.entitlements
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: ExtensionHost/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
      configs:
        Debug: &devHost
          PRODUCT_BUNDLE_IDENTIFIER: com.orbtorrent.mac.dev.extension-host
        Dev: *devHost

  OrbTorrentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OrbTorrentTests
    dependencies:
      - target: OrbTorrent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbtorrent.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrbTorrent.app/Contents/MacOS/OrbTorrent
        BUNDLE_LOADER: $(TEST_HOST)
        # The app imports Sparkle, so its module must be found here too.
        FRAMEWORK_SEARCH_PATHS: $(PROJECT_DIR)/build/sparkle
      configs:
        Debug: &devTests
          TEST_HOST: $(BUILT_PRODUCTS_DIR)/OrbTorrent Dev.app/Contents/MacOS/OrbTorrent Dev
        Dev: *devTests
